
name: Build OpenWrt BE6500

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET: ipq53xx
      SUBTARGET: generic
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache libncurses-dev libssl-dev git curl wget unzip bzip2 flex bison gawk python3 python3-pip

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate default config
        run: |
          make defconfig

      - name: Compile firmware
        run: make -j$(nproc)

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-be6500-firmware
          path: bin/targets/ipq53xx/generic/
